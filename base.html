<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>{% block title %}PWTDS — Wi-Fi Security Scanner{% endblock %}</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='theme.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='chatbot.css') }}">
</head>
<body>
<canvas id="bg" aria-hidden="true"></canvas>
<div class="bgs-sonar" aria-hidden="true">
  <div class="sn-ring" style="--d:0s"></div>
  <div class="sn-ring" style="--d:.95s"></div>
  <div class="sn-ring" style="--d:1.9s"></div>
  <div class="sn-ring" style="--d:2.85s"></div>
  <div class="sn-core"></div>
</div>
<nav class="nav">
  <div class="nav-inner">
    <div class="mark" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="#4cc9e6" stroke-width="1.8" stroke-linecap="round">
        <path d="M2 9.5a15 15 0 0 1 20 0"/><path d="M5 13a10 10 0 0 1 14 0"/>
        <path d="M8.2 16.3a5 5 0 0 1 7.6 0"/><circle cx="12" cy="20" r="1.2" fill="#4cc9e6" stroke="none"/>
      </svg>
    </div>
    <span class="wordmark">PWTDS</span>
    <div class="nav-links">
      <a href="{{ url_for('learn') }}" class="{{ 'active' if page=='learn' else '' }}">Learn</a>
      <a href="{{ url_for('history_page') }}" class="{{ 'active' if page=='history' else '' }}">History</a>
      <a href="{{ url_for('about') }}" class="{{ 'active' if page=='about' else '' }}">About</a>
      <a href="{{ url_for('index') }}" class="nav-cta">Scan</a>
    </div>
    <button class="nav-burger" id="navBurger" aria-label="Toggle menu" aria-expanded="false">
      <svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
    </button>
  </div>
</nav>

{% block content %}{% endblock %}

<footer class="site-footer">
  <div class="sf-inner">
    <span class="wordmark">PWTDS</span>
    <span>Public Wi-Fi threat detection &amp; risk assessment</span>
    <span class="sf-right">v2.0 · scan-first redesign · runs locally</span>
  </div>
</footer>

<script src="{{ url_for('static', filename='particles.js') }}"></script>
<script>
/* mobile menu toggle */
(function(){
  var b=document.getElementById("navBurger"), l=document.querySelector(".nav-links");
  if(b&&l){
    b.addEventListener("click", function(){
      var open=l.classList.toggle("open");
      b.setAttribute("aria-expanded", open?"true":"false");
    });
  }
})();
/* gentle scroll-reveal for cards and sections */
(function(){
  var els=document.querySelectorAll(".feat,.step,.learn-card,.sectlabel,.section-head,.page-hero,.empty,.hist,.hstat,.pillar,.focus-card");
  if(!els.length||!("IntersectionObserver" in window)) return;
  if(window.matchMedia&&window.matchMedia("(prefers-reduced-motion:reduce)").matches) return;
  els.forEach(function(e){ e.classList.add("reveal"); });
  var io=new IntersectionObserver(function(es){
    es.forEach(function(x){ if(x.isIntersecting){ x.target.classList.add("in"); io.unobserve(x.target); } });
  },{threshold:.1, rootMargin:"0px 0px -36px 0px"});
  els.forEach(function(e){ io.observe(e); });
})();
</script>
{% block scripts %}{% endblock %}
</body>
</html>
